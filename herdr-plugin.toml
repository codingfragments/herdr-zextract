id = "herdr-zextract"
name = "herdr-zextract"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "zextract"
title = "zextract"
command = ["./target/release/herdr-zextract"]
placement = "popup"
width = "80%"
height = "80%"

# Launcher actions: each is a thin invocation of `herdr plugin pane
# open` for the "zextract" pane above, selecting a named *profile* via
# --env ZEXTRACT_PROFILE - the profile's actual grab scope/pattern
# allowlist/query pre-fill live in the user's own config.toml under
# [profiles.<name>], never here (see doc/config-reference.md). Actions
# run headlessly (no real PTY - confirmed live), so they can't be the
# popup itself; they just fire the real popup open, which does get a
# real PTY. Bind a key to each action's id via a `[[keys.command]]`
# entry with `type = "plugin_action"` in your own
# ~/.config/herdr/config.toml - see doc/keybinding.md.

[[actions]]
id = "zextract-open"
title = "zextract: current pane"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-zextract", "--entrypoint", "zextract", "--env", "ZEXTRACT_PROFILE=open"]

[[actions]]
id = "zextract-tab"
title = "zextract: whole tab"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-zextract", "--entrypoint", "zextract", "--env", "ZEXTRACT_PROFILE=tab"]

[[actions]]
id = "zextract-url"
title = "zextract: URLs/IPs only, current pane"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-zextract", "--entrypoint", "zextract", "--env", "ZEXTRACT_PROFILE=url"]

[[actions]]
id = "zextract-url-tab"
title = "zextract: URLs/IPs only, whole tab"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-zextract", "--entrypoint", "zextract", "--env", "ZEXTRACT_PROFILE=url-tab"]

# Ten free-form slots for whatever combination the built-in four don't
# cover - define a matching [profiles.customN] block in your own
# config.toml (grab scope, pattern allowlist, query pre-fill) and bind
# a key to the zextract-customN action with that same N. Undefined
# customN profiles just fall back to plain defaults (quick grab, no
# pattern restriction), so binding one before configuring it is safe.
[[actions]]
id = "zextract-custom0"
title = "zextract: custom profile 0"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-zextract", "--entrypoint", "zextract", "--env", "ZEXTRACT_PROFILE=custom0"]

[[actions]]
id = "zextract-custom1"
