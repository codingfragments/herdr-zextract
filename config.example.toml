# herdr-zextract config
#
# Copy this file to the path printed by:
#   herdr plugin config-dir herdr-zextract
# as config.toml (or run the plugin once with no config and press
# Ctrl-W in the picker to have it write this same file for you).
#
# Full reference: doc/config-reference.md in the plugin repo.
# This file is read once per popup launch - no live reload.

# Verbosity of stderr diagnostics. One of: off, error, warn, info, debug.
# log_level = "info"

[patterns]
# Built-in type tags or custom pattern names to skip entirely.
# Built-in tags: url, file, diag, git, sha, ipv4, ipv6, uuid, quote, cmd, secret
# disable = ["ipv6"]

[patterns.secret]
# Curated formats (JWT, AWS, GitHub, ...) always run. Set false to
# disable the broader entropy-based fallback pass.
entropy_filter = true

[patterns.command]
# Opt-in third command-detection strategy: finds a standalone -x/--flag
# token and walks back to the command word, for commands with no
# recognized prompt marker and no known trigger word (e.g. `[dry-run]
# jq -r '.foo' file.json`). Off by default - can false-positive on
# prose containing flag-looking tokens.
flag_anchored = false

# Custom regex patterns. Each gets its own #name filter tag in the
# picker. Uncomment and adjust, or add your own [[patterns.custom]]
# blocks below.
#
# [[patterns.custom]]
# name = "jira"
# regex = "([A-Z]+)-([0-9]+)"
# type = "url"
# template = "https://jira.example.com/browse/{1}-{2}"

# Named profiles, selected at launch by the keybind action's
# ZEXTRACT_PROFILE env var (see herdr-plugin.toml / doc/keybinding.md).
# Each bundles a grab scope, a pattern allowlist, and a query pre-fill
# - this is the layer you're meant to tune per keybind, not
# herdr-plugin.toml itself.
#
# "open", "tab", "url", and "url-tab" already work with zero config
# here (built-in defaults matching the shipped zextract-open/-tab/-url/
# -url-tab actions) - only add a block below to override one.
#
# [profiles.open]
# grab = "quick"          # quick | deep | viewport | full | tab-scan
#
# [profiles.tab]
# grab = "tab-scan"
#
# [profiles.url]
# patterns = ["url", "ipv4", "ipv6"]
#
# [profiles.url-tab]
# grab = "tab-scan"
# patterns = ["url", "ipv4", "ipv6"]
#
# Ten free slots (custom0..custom9) with no built-in default - bind a
# key to the matching zextract-customN action in herdr-plugin.toml,
# then define whatever combination you want here. Example: secrets
# only, deep scrollback, current pane.
#
# [profiles.custom0]
# grab = "deep"
# patterns = ["secret"]

# Named grab-profile *definitions* - what "quick"/"deep"/etc. actually
# mean (source + line cap), as opposed to [profiles.*] above (which
# only ever *selects* a grab profile by name). Built-in defaults for
# quick/deep/viewport/full/tab-scan work with zero config here; add a
# block only to override one, or define a wholly new name.
#
# [grab_profiles.deep]
# source = "scrollback"   # scrollback | viewport | tab
# lines = 3000             # override the built-in 1500
#
# [grab_profiles.tab-scan]
# disable = ["secret", "ipv6"]   # skip these only while this profile is active
#
# [grab_profiles.jira-deep]
# source = "scrollback"
# lines = 500
