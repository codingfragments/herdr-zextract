name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only - no cross/QEMU needed for any target
          # (see PLANNING.md §12's confirmed-live aarch64-linux finding).
          # No x86_64-apple-darwin (Intel Mac) - not worth the CI minutes
          # for a platform with negligible remaining install base among
          # this plugin's users; build from source there instead.
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip and package
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          strip herdr-zextract
          archive="herdr-zextract-${{ matrix.target }}.tar.gz"
          tar czf "$archive" herdr-zextract
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-zextract-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/herdr-zextract-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/herdr-zextract-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
